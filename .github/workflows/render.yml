name: render-mv

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sheet=只看图, video=出片"
        type: choice
        options: [sheet, video]
        default: video
      project:
        description: "项目目录"
        default: projects/mv
      range:
        description: "只渲染这段时间，例 0:10"
        default: "0:10"

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: "1"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install chrome
        id: chrome
        timeout-minutes: 5
        uses: browser-actions/setup-chrome@v1

      - name: install ffmpeg
        timeout-minutes: 6
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: scaffold
        timeout-minutes: 4
        run: |
          P="${{ github.event.inputs.project }}"
          mkdir -p "$P"
          cp -r skills/painted-animation/template/. "$P"/
          mkdir -p "$P/assets"
          if [ -d assets ]; then cp -n assets/* "$P/assets/" || true; fi
          ls -la "$P" | head -20

      - name: npm install
        timeout-minutes: 8
        working-directory: ${{ github.event.inputs.project }}
        run: npm install --no-audit --no-fund

      - name: render sheet
        if: github.event.inputs.mode == 'sheet'
        timeout-minutes: 10
        working-directory: ${{ github.event.inputs.project }}
        run: |
          node render.mjs --sheet=0.5,2,4,6 --cols=4 --w=480 --soft-gl \
            --out=out/check/a.jpg \
            --chrome=${{ steps.chrome.outputs.chrome-path }}

      - name: render video
        if: github.event.inputs.mode == 'video'
        timeout-minutes: 55
        working-directory: ${{ github.event.inputs.project }}
        run: |
          AUDIO=$(ls assets/*.ogg assets/*.mp3 2>/dev/null | head -1)
          echo "audio = $AUDIO"
          CHROME="${{ steps.chrome.outputs.chrome-path }}"
          ok=0
          for w in 4 2 1; do
            for try in 1 2 3; do
              echo "--- workers=$w try=$try ---"
              if node render.mjs --frames --workers=$w --soft-gl \
                   --range=${{ github.event.inputs.range }} --chrome="$CHROME"; then
                ok=1; break 2
              fi
              echo "failed, sleep 15s"
              sleep 15
            done
          done
          if [ "$ok" != "1" ]; then echo "frames 全部失败"; exit 1; fi
          node render.mjs --encode --out=out/video.mp4 --audio="$AUDIO"

      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mv-output
          path: |
            ${{ github.event.inputs.project }}/out/**/*.jpg
            ${{ github.event.inputs.project }}/out/**/*.mp4
          retention-days: 7
